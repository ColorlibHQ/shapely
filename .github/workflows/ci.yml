name: CI

# Replaces the .travis.yml pipeline, which targeted PHP 5.4-7.1 and stopped
# running when Travis withdrew free OSS builds.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is the theme's declared "Requires PHP"; ceiling is current stable.
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check every PHP file
        run: |
          find -L . -name '*.php' -not -path './node_modules/*' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -d error_reporting=E_ALL -l \
            | (! grep -v '^No syntax errors')

  phpcs:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Install PHPCS + standards
        run: |
          # phpcodesniffer-composer-installer is a Composer plugin, and Composer
          # refuses to run plugins that are not explicitly allow-listed. Without
          # this the require aborts before PHPCS is ever installed.
          composer global config --no-plugins --no-interaction \
            allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer \
            phpcompatibility/php-compatibility \
            dealerdirect/phpcodesniffer-composer-installer
          echo "$HOME/.composer/vendor/bin" >> "$GITHUB_PATH"

      - name: PHPCompatibility (7.4-)
        run: phpcs -q --standard=PHPCompatibility --runtime-set testVersion 7.4- --extensions=php --report=checkstyle . | cs2pr

  js-css:
    name: Lint JS + CSS + i18n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Stylelint
        run: npm run lint:css

      - name: Text domain check
        run: npm run i18n:check

  build:
    name: Build theme archive
    runs-on: ubuntu-latest
    needs: [php, js-css]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # `npm run build` runs the text domain check via prebuild.
      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: shapely-theme
          path: shapely.zip
          if-no-files-found: error
